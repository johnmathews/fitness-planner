name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # npm 10.9 (bundled with Node 22) crashes resolving this tree; see docs/development.md.
      - run: npm install -g npm@11
      - run: npm ci
      # ESLint carries the Tailwind class rules (no palette or arbitrary colours) and the template
      # accessibility rules (eslint.config.ts).
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:coverage
      - run: npm run build-only
      # The design system's own gate: token shape, every contrast pair in every theme, the
      # forbidden words, and every required component card (ubuntu-latest's python3; stdlib only).
      - name: Design-system gate
        run: python3 scripts/check_design_system.py brand/design-system --complete
      # tokens.css is generated from tokens.json; a hand edit, or a tokens.json change without
      # `npm run tokens`, fails here.
      - name: tokens.css is current
        run: npm run tokens && git diff --exit-code src/styles/tokens.css

  # The browser checks (e2e/): axe in both themes and every ink, no sideways scroll at 375px, the
  # focus ring, and focus clear of the sticky name column, against the dev server with /api mocked.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-uv publishes only full version tags, no floating major tag.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: api
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Runs the shared fixtures in ../fixtures/transfer/ too; fails under the floor in pyproject.toml.
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - name: Audit dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          # Pinned and hashed, so pip-audit needs no pip of its own to resolve them.
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
