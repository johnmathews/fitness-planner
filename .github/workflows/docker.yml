name: Docker

on:
  pull_request:
  # Publishing waits for CI to pass on main: the home server auto-deploys :latest (What's Up
  # Docker), so an image on GHCR is a production deploy and a red commit must never get one.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # Pull requests prove both Dockerfiles build, with a read-only token.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: web
            context: .
          - name: api
            context: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
      # The multi-arch build above runs before QEMU is set up, so it proves the API image needs
      # none. Then prove each architecture runs: amd64 serves /api/healthz, and arm64 (under QEMU)
      # imports its native modules.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: matrix.name == 'api'
        with:
          context: api
          platforms: linux/amd64
          load: true
          tags: api-smoke:amd64
          cache-from: type=gha,scope=api
      - name: Smoke-test the amd64 API image
        if: matrix.name == 'api'
        run: |
          docker run -d --name api -p 8000:8000 -e PUBLIC_ORIGIN=https://smoke.example api-smoke:amd64
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/healthz && exit 0; sleep 1; done
          docker logs api
          exit 1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.name == 'api'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: matrix.name == 'api'
        with:
          context: api
          platforms: linux/arm64
          load: true
          tags: api-smoke:arm64
          cache-from: type=gha,scope=api
      - name: Smoke-test the arm64 API image
        if: matrix.name == 'api'
        run: |
          docker run --rm --platform linux/arm64 api-smoke:arm64 \
            python -c "import argon2, pydantic_core, tracker_api.app; print('ok')"

  # Both images together behind nginx, as production runs them: sign-up, writes and reads through
  # the /api proxy, the write guard, and nginx still serving the app with the API stopped.
  compose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/compose-smoke.sh

  # Only a green CI run on a push to main gets packages: write and publishes to GHCR.
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: web
            context: .
            image: ghcr.io/johnmathews/tracker
          - name: api
            context: api
            image: ghcr.io/johnmathews/tracker-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # workflow_run starts on the default branch's newest commit, which may be newer than
          # the one CI just passed. Build exactly the commit CI passed.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Under workflow_run, github.sha is the default branch's HEAD, not the commit CI passed,
      # so metadata-action's own `type=sha` would name the wrong commit. (Its `context: git`
      # cannot help: it fails on the detached HEAD a SHA checkout leaves.) Tag and label the
      # commit explicitly instead.
      - id: commit
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
