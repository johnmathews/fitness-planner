<!-- @dsCard group="Basics" height=520 subtitle="Primary, secondary and quiet; md 44px and sm 36px; every state" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  section { margin: 0 0 var(--space-6); }
  section:last-of-type { margin-bottom: 0; }
  h2 { margin: 0 0 var(--space-2); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-4); align-items: flex-end; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); }
  .state { margin: 0; color: var(--ink-secondary); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); box-sizing: border-box; height: 44px; padding: 0 var(--space-4); border: 1px solid transparent; border-radius: var(--radius-md); font: 600 16px/24px var(--font-sans); cursor: pointer; text-wrap: nowrap; }
  .btn.sm { height: 36px; padding: 0 var(--space-3); font-size: 14px; line-height: 20px; }
  .btn:focus-visible, .btn.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .primary { background: var(--ink); color: var(--on-ink); }
  .primary:hover, .primary.is-hover { background: color-mix(in srgb, var(--ink) 82%, var(--canvas)); }
  .secondary { background: transparent; color: var(--ink); border-color: var(--control-border); }
  .secondary:hover, .secondary.is-hover { background: var(--tile); }
  .quiet { background: transparent; color: var(--ink); }
  .quiet:hover, .quiet.is-hover { background: var(--tile); }
  .btn[aria-busy="true"] { cursor: progress; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn:disabled:hover { background: transparent; }
  .primary:disabled:hover { background: var(--ink); }
  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: background-color 120ms ease-out, color 120ms ease-out; }
  }
</style>
</head>
<body>
<section aria-labelledby="h-primary">
  <h2 class="label" id="h-primary">Primary</h2>
  <div class="row">
    <div class="cell"><p class="caption state">Default</p><button class="btn primary" type="button">Sign in</button></div>
    <div class="cell"><p class="caption state">Hover</p><button class="btn primary is-hover" type="button">Sign in</button></div>
    <div class="cell"><p class="caption state">Focus</p><button class="btn primary is-focus" type="button">Sign in</button></div>
    <div class="cell"><p class="caption state">Busy</p><button class="btn primary" type="button" aria-busy="true">Signing in…</button></div>
    <div class="cell"><p class="caption state">Small</p><button class="btn primary sm" type="button">Add exercise</button></div>
  </div>
</section>
<section aria-labelledby="h-secondary">
  <h2 class="label" id="h-secondary">Secondary</h2>
  <div class="row">
    <div class="cell"><p class="caption state">Default</p><button class="btn secondary" type="button">Not mine</button></div>
    <div class="cell"><p class="caption state">Hover</p><button class="btn secondary is-hover" type="button">Not mine</button></div>
    <div class="cell"><p class="caption state">Focus</p><button class="btn secondary is-focus" type="button">Not mine</button></div>
    <div class="cell"><p class="caption state">Busy</p><button class="btn secondary" type="button" aria-busy="true">Importing…</button></div>
    <div class="cell"><p class="caption state">Small</p><button class="btn secondary sm" type="button">Export</button></div>
  </div>
</section>
<section aria-labelledby="h-quiet">
  <h2 class="label" id="h-quiet">Quiet</h2>
  <div class="row">
    <div class="cell"><p class="caption state">Default</p><button class="btn quiet" type="button">Later</button></div>
    <div class="cell"><p class="caption state">Hover</p><button class="btn quiet is-hover" type="button">Later</button></div>
    <div class="cell"><p class="caption state">Focus</p><button class="btn quiet is-focus" type="button">Later</button></div>
    <div class="cell"><p class="caption state">Small</p><button class="btn quiet sm" type="button">This week</button></div>
    <div class="cell"><p class="caption state">Disabled</p><button class="btn secondary" type="button" disabled>Copy plan to next week</button></div>
  </div>
</section>
<script></script>
</body>
</html>
