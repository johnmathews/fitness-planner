<!-- @dsCard group="Forms" height=220 subtitle="One setting on or off; the whole row is the 44px target" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-6); align-items: flex-start; }
  .cell { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); }
  .state { margin: 0; color: var(--ink-secondary); }

  .switch { display: inline-flex; align-items: center; gap: var(--space-3); height: 44px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); font: 400 16px/24px var(--font-sans); cursor: pointer; text-wrap: nowrap; }
  .switch:hover, .switch.is-hover { background: var(--tile); }
  .switch:focus-visible, .switch.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .switch:disabled { opacity: .4; cursor: not-allowed; background: transparent; }
  .track { position: relative; box-sizing: border-box; flex: none; width: 40px; height: 24px; border: 1px solid var(--control-border); border-radius: var(--radius-full); background: transparent; }
  .thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: var(--radius-full); background: var(--ink-secondary); }
  .switch[aria-checked="true"] .track { background: var(--ink); border-color: var(--ink); }
  .switch[aria-checked="true"] .thumb { left: 19px; background: var(--on-ink); }
  @media (prefers-reduced-motion: no-preference) {
    .switch, .track, .thumb { transition: background-color 120ms ease-out, border-color 120ms ease-out; }
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><p class="caption state">Off</p>
    <button class="switch" type="button" role="switch" aria-checked="false">Edit plan<span class="track" aria-hidden="true"><span class="thumb"></span></span></button></div>
  <div class="cell"><p class="caption state">On</p>
    <button class="switch" type="button" role="switch" aria-checked="true">Edit plan<span class="track" aria-hidden="true"><span class="thumb"></span></span></button></div>
  <div class="cell"><p class="caption state">Hover</p>
    <button class="switch is-hover" type="button" role="switch" aria-checked="false">Edit plan<span class="track" aria-hidden="true"><span class="thumb"></span></span></button></div>
  <div class="cell"><p class="caption state">Focus</p>
    <button class="switch is-focus" type="button" role="switch" aria-checked="true">Edit plan<span class="track" aria-hidden="true"><span class="thumb"></span></span></button></div>
  <div class="cell"><p class="caption state">Disabled</p>
    <button class="switch" type="button" role="switch" aria-checked="false" disabled>Edit plan<span class="track" aria-hidden="true"><span class="thumb"></span></span></button></div>
</div>
<script></script>
</body>
</html>
