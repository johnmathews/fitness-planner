<!-- @dsCard group="Forms" height=400 subtitle="Choose the pen: four inks, chosen one marked by ring, check and name" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InkPicker — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: flex; flex-wrap: wrap; gap: var(--space-6) var(--space-8); align-items: flex-start; }
  .cell { flex: 1 1 300px; min-width: 0; max-width: 360px; }
  .state { margin: 0 0 var(--space-2); color: var(--ink-secondary); }
  .field { display: flex; flex-direction: column; gap: var(--space-1); }
  .hint { margin: 0 0 var(--space-1); color: var(--ink-secondary); }

  .inks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-1) var(--space-2); }
  .ink { display: flex; align-items: center; gap: var(--space-3); box-sizing: border-box; min-width: 0; height: 44px; padding: 0 var(--space-2) 0 var(--space-3); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); font: 400 16px/24px var(--font-sans); text-align: left; cursor: pointer; }
  .ink:hover, .ink.is-hover { background: var(--tile); }
  .ink:focus-visible, .ink.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .ink .name { flex: 1; min-width: 0; }
  .ink[aria-checked="true"] .name { font-weight: 600; }
  .dot { flex: none; width: 24px; height: 24px; border-radius: var(--radius-full); }
  .ink[aria-checked="true"] .dot { outline: 2px solid var(--ink); outline-offset: 2px; }
  .ink .tick { flex: none; display: inline-flex; width: 20px; height: 20px; visibility: hidden; }
  .ink .tick svg { width: 20px; height: 20px; }
  .ink[aria-checked="true"] .tick { visibility: visible; }
  .ink-blue { background: var(--ink-blue); }
  .forest { background: var(--forest); }
  .violet { background: var(--violet); }
  .graphite { background: var(--graphite); }
  @media (prefers-reduced-motion: no-preference) {
    .ink { transition: background-color 120ms ease-out; }
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><p class="caption state">Ink blue chosen (the default); hover on Graphite</p>
    <div class="field"><span class="label" id="k1">Ink</span>
      <p class="caption hint" id="k1-hint">The colour of a done mark.</p>
      <div class="inks" role="radiogroup" aria-labelledby="k1" aria-describedby="k1-hint">
        <button class="ink" type="button" role="radio" aria-checked="true" tabindex="0"><span class="dot ink-blue"></span><span class="name">Ink blue</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="ink" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="dot forest"></span><span class="name">Forest</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="ink" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="dot violet"></span><span class="name">Violet</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="ink is-hover" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="dot graphite"></span><span class="name">Graphite</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
      </div></div></div>
  <div class="cell"><p class="caption state">Forest chosen; keyboard focus on it</p>
    <div class="field"><span class="label" id="k2">Ink</span>
      <p class="caption hint" id="k2-hint">The colour of a done mark.</p>
      <div class="inks" role="radiogroup" aria-labelledby="k2" aria-describedby="k2-hint">
        <button class="ink" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="dot ink-blue"></span><span class="name">Ink blue</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="ink is-focus" type="button" role="radio" aria-checked="true" tabindex="0"><span class="dot forest"></span><span class="name">Forest</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="ink" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="dot violet"></span><span class="name">Violet</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
        <button class="ink" type="button" role="radio" aria-checked="false" tabindex="-1"><span class="dot graphite"></span><span class="name">Graphite</span><span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></button>
      </div></div></div>
</div>
<script></script>
</body>
</html>
