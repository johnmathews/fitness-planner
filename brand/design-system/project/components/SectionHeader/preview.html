<!-- @dsCard group="Planner" height=360 subtitle="Section title, its one number, and the hint line" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SectionHeader — preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  .section-header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--space-1) var(--space-4); padding-bottom: var(--space-6); }
  .section-header + .section-header { padding-top: var(--space-8); border-top: 1px solid var(--line); }
  .titles { display: flex; flex-direction: column; gap: var(--space-1); }
  h2 { margin: 0; }
  .hint { margin: 0; color: var(--ink-secondary); }

  .stat { margin: 0; display: flex; align-items: baseline; gap: var(--space-2); }
  .stat .fig { font-size: 20px; line-height: 26px; font-weight: 600; }
  .stat .rest { color: var(--ink-secondary); }
  .stat.met .fig { color: var(--pen); }
  .stat.zero .fig { color: var(--ink-secondary); font-weight: 400; }
  @media (max-width: 639px) { body { padding: var(--space-4); } }
</style>
</head>
<body>
<header class="section-header">
  <div class="titles">
    <h2 class="title-1" id="ex">Exercises</h2>
    <p class="hint caption">Pick three a day. Mark each one when it's done.</p>
  </div>
  <p class="stat"><span class="fig">10</span><span class="rest body-large">of 12 this week</span></p>
</header>
<header class="section-header">
  <div class="titles">
    <h2 class="title-1">Diet</h2>
    <p class="hint caption">Mark each day you ate it.</p>
  </div>
  <p class="stat met"><span class="fig">4</span><span class="rest body-large">of 4 goals met</span></p>
</header>
<header class="section-header">
  <div class="titles">
    <h2 class="title-1">Exercises</h2>
    <p class="hint caption">Pick three a day. Mark each one when it's done.</p>
  </div>
  <p class="stat zero"><span class="fig">0</span><span class="rest body-large">of 12 this week</span></p>
</header>
<script></script>
</body>
</html>
