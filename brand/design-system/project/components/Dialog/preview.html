<!-- @dsCard group="Overlays" height=700 subtitle="A modal panel on the scrim: Edit exercise" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dialog — preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }

  /* The stage stands in for the viewport: the page behind, the scrim, the dialog. */
  .stage { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius-lg); min-height: 640px; padding: var(--space-6); }
  .behind h1 { margin: 0 0 var(--space-6); }
  .behind p { margin: 0; padding: var(--space-3) 0; border-bottom: 1px solid var(--line); font-weight: 600; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); opacity: .4; }

  .dialog { position: absolute; top: var(--space-16); left: 50%; transform: translateX(-50%); width: min(416px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay); padding: var(--space-6); }
  .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-2); margin: calc(-1 * var(--space-3)) calc(-1 * var(--space-3)) 0 0; }
  .dialog-head h2 { margin: var(--space-3) 0 0; }
  form { display: flex; flex-direction: column; gap: var(--space-4); margin-top: var(--space-4); }

  /* IconButton: 44px, Lucide icon at 20px. */
  .icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); cursor: pointer; }
  .icon-btn:hover { background: var(--tile); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Fields: visible label above, 44px input. */
  .field { display: flex; flex-direction: column; gap: var(--space-1); }
  .hint { color: var(--ink-secondary); }
  input { height: 44px; width: 100%; padding: 0 var(--space-3); border: 1px solid var(--control-border); border-radius: var(--radius-sm); background: var(--panel); color: var(--ink); font: inherit; font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; }
  .narrow { width: 88px; }
  .weight { width: 128px; }

  .seg-wrap { display: flex; flex-direction: column; gap: var(--space-1); }
  /* SegmentedControl, drawn exactly as its own card: 44px tall, no inset, every segment in label type. */
  .seg { display: inline-flex; flex-wrap: wrap; align-self: flex-start; box-sizing: border-box; max-width: 100%; border: 1px solid var(--control-border); border-radius: var(--radius-md); }
  .seg button { position: relative; height: 42px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); font: 600 14px/20px var(--font-sans); cursor: pointer; text-wrap: nowrap; }
  .seg button:hover, .seg button.is-hover { background: var(--tile); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .seg button:focus-visible, .seg button.is-focus { z-index: 1; outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .seg button { transition: background-color 120ms ease-out, color 120ms ease-out; }
  }

  .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-2); padding-top: var(--space-2); }
  .btn { height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-md); font: inherit; font-weight: 600; cursor: pointer; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--control-border); }
  .btn.secondary:hover { background: var(--tile); }
  .btn.primary { background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { .btn, .icon-btn, .seg button { transition: background-color 120ms, color 120ms; } }
  @media (max-width: 639px) {
    body { padding: var(--space-4); }
    .stage { padding: var(--space-4); min-height: 640px; }
    .dialog { top: var(--space-12); padding: var(--space-4); }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="behind" aria-hidden="true" inert>
    <h1 class="title-1">Exercises</h1>
    <p>Push-ups</p>
    <p>Pull-ups</p>
    <p>Squats</p>
    <p>Kettlebell halos</p>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <div class="dialog-head">
      <h2 class="title-2" id="dlg-title">Edit exercise</h2>
      <button type="button" class="icon-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
      </button>
    </div>
    <form onsubmit="return false">
      <div class="field">
        <label class="label" for="f-name">Name</label>
        <input id="f-name" value="Kettlebell halos" required>
      </div>
      <div class="row">
        <div class="field narrow">
          <label class="label" for="f-sets">Sets</label>
          <input id="f-sets" value="3" inputmode="numeric" maxlength="2">
        </div>
        <div class="field narrow">
          <label class="label" for="f-reps">Reps</label>
          <input id="f-reps" value="8" inputmode="numeric">
        </div>
        <div class="seg-wrap">
          <span class="label" id="f-count">Reps count</span>
          <div class="seg" role="group" aria-labelledby="f-count">
            <button type="button" tabindex="-1" aria-pressed="false">Per set</button>
            <button type="button" tabindex="0" aria-pressed="true">Each side</button>
          </div>
        </div>
      </div>
      <div class="field">
        <label class="label" for="f-weight">Weight in kg</label>
        <input id="f-weight" class="weight" value="8" inputmode="decimal" aria-describedby="f-weight-hint">
        <span class="hint caption" id="f-weight-hint">Optional. Leave empty for bodyweight.</span>
      </div>
      <div class="actions">
        <button type="button" class="btn secondary">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </div>
</div>
<script>
(() => {
  document.addEventListener('click', (e) => {
    const seg = e.target.closest('.seg button');
    if (seg) seg.parentElement.querySelectorAll('button').forEach((b) => { b.setAttribute('aria-pressed', String(b === seg)); b.tabIndex = b === seg ? 0 : -1; });
  });
  // SegmentedControl: one tab stop; arrow keys move between segments (Reka's roving focus).
  document.querySelectorAll('.seg').forEach((g) => g.addEventListener('keydown', (e) => {
    const all = [...g.querySelectorAll('button:not([disabled])')];
    const i = all.indexOf(e.target);
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (i < 0 || !d) return;
    e.preventDefault();
    const next = all[(i + d + all.length) % all.length];
    all.forEach((b) => (b.tabIndex = b === next ? 0 : -1));
    next.focus();
  }));
})();
</script>
</body>
</html>
