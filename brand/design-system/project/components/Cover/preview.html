<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  html, body { margin: 0; }
  body { background: var(--canvas); color: var(--ink); width: 960px; height: 288px; position: relative; overflow: hidden; }
  .art { position: absolute; inset: 0; }
  .tile { fill: var(--tile); rx: var(--radius-lg); }
  .band { fill: var(--highlight); rx: var(--radius-sm); }
  .box { fill: none; stroke: var(--control-border); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .scribble { fill: none; stroke: currentColor; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .solid { fill: currentColor; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
  .great { color: var(--pen); }
  .partial { color: var(--pen-partial); }
  .missed { color: var(--pen-missed); }
  .slab { fill: var(--ink); }
  .disc { fill: var(--ink); }
  .words { position: absolute; left: 48px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-serif); font-weight: 600; font-size: 64px; line-height: .95; letter-spacing: -0.01em; }
  .tagline { margin: 16px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-secondary); }
</style>
</head>
<body>
<svg class="art" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <!--
    blocks: tile 256x240 (space-16 x4, space-12 x5) radius-lg; ink slab 144x168 (space-12 x3) bleeding off the top, square;
            ink disc 64 (space-16) radius-full; highlight band 32x208 (space-8) radius-sm down the today column.
    arrangement: one tile slab holding the pattern, the ink slab and the ink disc as satellites, all right of x = 480.
    pattern: the brand's own mark, a hand-drawn box, empty or filled in its pen with one of the three marker drawings (an open zigzag, a solid fill, a dense hatch), the box drawn over the fill, 28 of them as four weeks of seven days;
             chosen because "a mark per session, read at a glance" is the one shape only this system has.
    name: "Fitness Planner design system" at 64px on three lines in the 440px block: two lines would need 56px ("Fitness Planner" is 471px at 64px), and the name says what the document is.
    steps and radii: pitch space-8 across, space-12 down, mark 23px (the DayMark's 36-unit paths at 0.84 round their centre, so a stroke that runs past its box stays clear of the next day's), radius-sm, radius-lg, radius-full.
  -->
