<!-- @dsCard group="Planner" height=1180 subtitle="Exercises and Food a screen each, the scroll snapping, the bar out of sight: a desktop and a phone held upright" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlannerScreen — preview</title>
<style>
  body { margin: 0; padding: var(--space-6); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .variant { margin: 0 0 var(--space-3); color: var(--ink-secondary); }
  .gap { height: var(--space-8); }
  /* A device: the screen at its real size in pixels, scaled to the card (the script sets the scale). */
  .device { position: relative; width: 100%; }
  .device > .fs { position: absolute; top: 0; left: 0; transform-origin: 0 0; border: 1px solid var(--line); border-radius: var(--radius-lg); }
  .device.phone { max-width: 300px; }
  .device.phone > .fs { border-radius: 28px; border-width: 2px; }
  @media (max-width: 639px) { body { padding: var(--space-4); } }
/*
  The full-screen planner, as a prototype. One frame (.fs) is one screen: a desktop, an iPad, a
  phone. Every size comes from the frame's own width and height (container units), so the same
  markup fills a 1440×900 desktop, a 390×844 phone and a scaled-down picture of either.
  Colours, fonts and type come from the system's tokens; the proposed sizes are --candidate-*.
*/
.fs {
  position: relative; overflow: hidden; box-sizing: border-box;
  container: fs / size;
  background: var(--canvas); color: var(--ink);
  font-family: var(--font-sans); font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent;
  /* The scale: 1 on a 1280×800 screen, up to 1.6 on a large one, never below 0.75. Read where
     it is used, so the container units measure the frame. */
  --candidate-u: clamp(0.75px, min(calc(100cqw / 1280), calc(100cqh / 800)), 1.6px);
  --u: var(--candidate-u);
  /* Proposed sizes at u = 1. The type grows with the screen, never below the system's 16px. */
  --candidate-pad: calc(var(--u) * 48);
  --candidate-title: calc(var(--u) * 40);
  --candidate-name: max(18px, calc(var(--u) * 24));
  --candidate-chip: max(16px, calc(var(--u) * 17));
  --candidate-day: max(16px, calc(var(--u) * 20));
  --candidate-figure: max(18px, calc(var(--u) * 26));
  --candidate-name-col: calc(var(--u) * 280);
  --candidate-week-col: calc(var(--u) * 150);
}
.fs *, .fs *::before, .fs *::after { box-sizing: border-box; }
.fs button { font: inherit; color: inherit; }
.fs .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.fs :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---- The screens: one section per screen, the scroll snapping to each. ---- */
.fs .scroller { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  scroll-snap-type: y mandatory; scrollbar-width: none; }
.fs .scroller::-webkit-scrollbar { display: none; }
.fs .screen { position: relative; min-height: 100cqh; scroll-snap-align: start;
  display: flex; flex-direction: column; justify-content: center;
  padding: calc(var(--u) * 28) var(--candidate-pad) calc(var(--u) * 20); }

/* The heading line: the section's name and week, its one figure at the right. */
.fs .head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 24px;
  flex-wrap: wrap; padding-bottom: calc(var(--u) * 20); }
.fs .head h2 { margin: 0; font: 600 var(--candidate-title) / 1.15 var(--font-serif); }
.fs .head .wk { margin-left: calc(var(--u) * 16); font: 400 var(--candidate-day) / 1.3 var(--font-sans); color: var(--ink-secondary); }
.fs .stat { margin: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.fs .stat .fig { font-size: var(--candidate-figure); line-height: 1.2; font-weight: 600; }
.fs .stat .rest { font-size: max(18px, calc(var(--u) * 22)); color: var(--ink-secondary); }
.fs .stat.met .fig { color: var(--pen); }
.fs .stat.zero .fig { color: var(--ink-secondary); font-weight: 400; }
.fs .check { display: inline-block; width: 0.8em; height: 0.8em; margin-left: 4px; color: var(--pen); vertical-align: -0.05em; }

/* ---- The week grid, filling what the heading leaves. ---- */
.fs .grid { flex: 1 1 auto; min-height: 0; display: grid;
  grid-template-columns: var(--candidate-name-col) repeat(7, minmax(0, 1fr));
  grid-template-rows: auto repeat(var(--rows), minmax(56px, 1fr));
  /* Rows stop at 1.25 × a day's width, so a tall screen centres the week instead of stretching it. */
  max-height: calc(var(--rows) * (100cqw - 2 * var(--candidate-pad) - var(--candidate-name-col)) / 7 * 1.25 + var(--u) * 240); }
.fs .grid > * { min-width: 0; }
.fs .hd { display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: calc(var(--u) * 12) 0; border-bottom: 1px solid var(--ink); }
.fs .hd .dn { font-size: var(--candidate-day); line-height: 1.25; font-weight: 600; }
.fs .hd .dt { font-size: max(16px, calc(var(--u) * 18)); line-height: 1.3; color: var(--ink-secondary); }
.fs .hd.today .dt { color: var(--ink); font-weight: 600; }
.fs .hd.corner { align-items: flex-start; justify-content: flex-end; }
.fs .hd.wkh { color: var(--ink-secondary); font-size: var(--candidate-day); font-weight: 600; justify-content: center; }
/* No band for today (K36). */
.fs .nm, .fs .d, .fs .tot { border-bottom: 1px solid var(--line); }
.fs .nm { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding-right: 12px; }
.fs .nm .n { font-size: var(--candidate-name); line-height: 1.25; font-weight: 600; overflow-wrap: anywhere; }
.fs .chips { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.fs .chip { font-size: var(--candidate-chip); line-height: 1.35; font-weight: 600; background: var(--tile); color: var(--ink-secondary);
  border-radius: var(--radius-sm); padding: 0 8px; white-space: nowrap; }
.fs .tot { display: flex; align-items: center; justify-content: center; white-space: nowrap; font-size: max(18px, calc(var(--u) * 24)); }
.fs .tot .fig { font-weight: 600; font-size: var(--candidate-figure); }
.fs .tot .fig.met { color: var(--pen); }
.fs .tot .of { color: var(--ink-secondary); margin-left: 0.25em; }

/* A day: its own size container, so the box (--candidate) takes 86% of the cell's shorter side, up to 128px. */
.fs .d { container-type: size; display: grid; place-items: center; }
.fs .mark { display: grid; place-items: center; width: min(86cqw, 86cqh, 128px);
  aspect-ratio: 1; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; cursor: pointer; touch-action: manipulation; }
.fs .mark svg { width: 94%; height: 94%; overflow: visible; }
.fs .mark .bx { stroke: var(--control-border); }
.fs .mark:not([data-mark]):hover .bx { stroke: var(--ink); }
.fs .mark[data-mark="great"] .ink { fill: var(--pen); }
.fs .mark[data-mark="partial"] .ink { fill: var(--pen-partial); }
.fs .mark[data-mark="missed"] .ink { fill: var(--pen-missed); }
.fs .mark .sym { stroke: var(--canvas); }
@media (prefers-reduced-motion: no-preference) { .fs .mark .bx, .fs .mark .ink { transition: stroke 120ms, fill 120ms; } }

/* The Picked row. */
.fs .pk { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: calc(var(--u) * 14) 2px; }
.fs .pk .fig { font-size: max(18px, calc(var(--u) * 24)); line-height: 1.3; font-weight: 600; }
.fs .pk .fig.under { color: var(--ink-secondary); font-weight: 400; }
.fs .pk .fig.over { color: var(--caution-ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.fs .pk .extra { font-size: 16px; line-height: 22px; color: var(--caution-ink); }
.fs .pk.lbl { align-items: flex-start; padding-left: 0; }
.fs .pk.lbl .n { font-size: var(--candidate-name); line-height: 1.25; }
.fs .pk.lbl .g { font-size: var(--candidate-chip); color: var(--ink-secondary); }

/* A short screen (a phone on its side): the title sits in the grid's corner. */
.fs .corner h2 { margin: 0; font: 600 var(--candidate-title) / 1.1 var(--font-serif); }
.fs .corner .wk { font-size: max(16px, calc(var(--u) * 18)); color: var(--ink-secondary); line-height: 1.3; }
.fs .corner .stat { margin-top: 4px; }
.fs .corner .stat .fig { font-size: max(18px, calc(var(--u) * 22)); }
.fs .corner .stat .rest { font-size: max(16px, calc(var(--u) * 18)); }

/* The way on: "Food" and an arrow at the foot of the first screen. */
.fs .cue { align-self: center; display: inline-flex; align-items: center; gap: 6px; margin-top: calc(var(--u) * 10);
  min-height: 44px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: transparent;
  color: var(--ink-secondary); font-size: max(16px, calc(var(--u) * 18)); font-weight: 600; cursor: pointer; }
.fs .cue:hover { background: var(--tile); color: var(--ink); }
.fs .cue svg { width: 20px; height: 20px; }

/* ---- The bar: the Header card, out of sight until it is wanted. ---- */
.fs .bar { position: absolute; z-index: 20; top: 0; left: 0; right: 0;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px 16px;
  min-height: 56px; padding: 4px var(--candidate-pad); background: var(--canvas); border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-overlay); transform: translateY(-105%); visibility: hidden; }
@media (prefers-reduced-motion: no-preference) { .fs .bar { transition: transform 160ms ease-out, visibility 160ms; } }
.fs[data-bar="shown"] .bar, .fs .bar:focus-within { transform: none; visibility: visible; }
.fs .bar .wordmark { display: block; height: 20px; width: auto; fill: var(--ink); justify-self: start; }
.fs .bar .wordmark { height: 20px; }
.fs .bar .start { justify-self: start; }
.fs .bar .end { justify-self: end; display: flex; align-items: center; gap: 8px; }
.fs .bar .week { display: flex; align-items: center; }
.fs .bar .week-label { min-width: 116px; padding-inline: 8px; text-align: center; font: 600 16px/24px var(--font-sans); white-space: nowrap; }
.fs .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0;
  border-radius: var(--radius-md); background: transparent; color: var(--ink); cursor: pointer; }
.fs .icon-btn svg { width: 20px; height: 20px; }
.fs .icon-btn:hover, .fs .btn:hover, .fs .switch:hover { background: var(--tile); }
.fs .btn { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border: 0; border-radius: var(--radius-md);
  background: transparent; color: var(--ink); font: 600 14px/20px var(--font-sans); cursor: pointer; white-space: nowrap; }
.fs .switch { display: inline-flex; align-items: center; gap: 12px; height: 44px; padding: 0 8px; border: 0; border-radius: var(--radius-md);
  background: transparent; color: var(--ink); font: 400 16px/24px var(--font-sans); cursor: pointer; white-space: nowrap; }
.fs .track { position: relative; flex: none; width: 40px; height: 24px; border: 1px solid var(--control-border); border-radius: var(--radius-full); }
.fs .thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: var(--radius-full); background: var(--ink-secondary); }
.fs .seg { display: inline-flex; border: 1px solid var(--control-border); border-radius: var(--radius-md); }
.fs .seg button { height: 42px; padding: 0 16px; border: 0; border-radius: var(--radius-sm); background: transparent; font: 600 14px/20px var(--font-sans); cursor: pointer; }
.fs .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

/* The pointer's way in: a strip along the top edge (a desktop, a trackpad on an iPad). */
.fs .hot { position: absolute; z-index: 19; top: 0; left: 0; right: 0; height: 14px; }
.fs[data-input="touch"] .hot { display: none; }
/* The finger's way in: a handle at the top centre. Press it, or pull it down. */
.fs .grab { position: absolute; z-index: 19; top: 0; left: 50%; transform: translateX(-50%); display: none;
  width: 88px; height: 28px; padding: 0; border: 0; background: transparent; cursor: pointer; touch-action: none; }
.fs .grab span { display: block; width: 40px; height: 5px; margin: 8px auto 0; border-radius: 3px; background: var(--control-border); }
.fs[data-input="touch"] .grab { display: block; }

/* ---- Phone, held upright ---- */
.fs[data-layout="narrow"] { --candidate-pad: 16px;
  /* The narrow scale: 1 on a phone, up to 1.4 on an iPad held upright. */
  --candidate-n: clamp(1px, calc(100cqw / 600), 1.4px); --n: var(--candidate-n); }
.fs[data-layout="narrow"] .screen { padding: calc(var(--n) * 34) calc(var(--n) * 16) 12px; justify-content: flex-start; }
.fs[data-layout="narrow"][data-device="tablet"] .screen { justify-content: center; }
.fs[data-layout="narrow"] .bar { grid-template-columns: 1fr auto 1fr; padding: 4px 8px 4px 16px; }
.fs[data-layout="narrow"] .bar .row-2 { grid-column: 1 / -1; justify-self: end; display: flex; align-items: center; gap: 8px; }
.fs[data-layout="narrow"] .bar .start { visibility: hidden; }
.fs[data-layout="narrow"] .head { padding-bottom: 12px; }
.fs[data-layout="narrow"] .head h2 { font-size: calc(var(--n) * 30); }
.fs[data-layout="narrow"] .head .wk { display: none; }
.fs[data-layout="narrow"] .stat .fig { font-size: calc(var(--n) * 20); }
.fs[data-layout="narrow"] .stat .rest { font-size: calc(var(--n) * 18); }

/* P2: the week, narrow. A row's name line spans the seven days; its seven boxes sit beneath. */
.fs .ngrid { flex: 1 1 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
  grid-template-rows: auto; grid-auto-rows: auto; align-content: start; }
.fs .ngrid .hd { padding: 6px 0; }
.fs .ngrid .hd .dn, .fs .ngrid .hd .dt { font-size: calc(var(--n) * 16); }
.fs .ngrid .line { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; padding: calc(var(--n) * 10) 0 2px; }
.fs .ngrid .line .n { font-size: calc(var(--n) * 18); line-height: 1.45; font-weight: 600; }
.fs .ngrid .line .chip { font-size: calc(var(--n) * 16); }
.fs .ngrid .line .tot { margin-left: auto; border: 0; font-size: calc(var(--n) * 18); }
.fs .ngrid .line .tot .fig { font-size: calc(var(--n) * 18); }
/* A row of boxes takes a share of the screen's height, so a tall phone spreads the week instead of leaving the foot empty. */
.fs .ngrid .d { height: clamp(48px, min(19cqw, 7.5cqh), 110px); border-bottom: 1px solid var(--line); }
.fs .ngrid .pk { padding: 6px 0 4px; }
.fs .ngrid .pk .fig { font-size: calc(var(--n) * 18); }
.fs .ngrid .pk .extra { font-size: 14px; line-height: 18px; }
.fs .ngrid .pkl { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; padding-top: calc(var(--n) * 12); }
.fs .ngrid .pkl .n { font-size: calc(var(--n) * 18); } .fs .ngrid .pkl .g { color: var(--ink-secondary); font-size: calc(var(--n) * 16); }

/* P1: today, full screen. One row per exercise, its mark at the right, sized to fill the screen. */
.fs .band { margin: 0 -16px 8px; padding: 14px 16px; background: var(--tile); }
.fs .band h2 { margin: 0; font: 600 22px/28px var(--font-sans); }
.fs .band p { margin: 2px 0 0; font-size: 18px; line-height: 26px; }
.fs .tl { flex: 1 1 auto; display: grid; grid-auto-rows: minmax(72px, 1fr); max-height: calc(var(--rows) * 120px); }
.fs .tl .row { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.fs .tl .row:first-child { border-top: 1px solid var(--line); }
.fs .tl .text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.fs .tl .n { font-size: 20px; line-height: 26px; font-weight: 600; }
.fs .tl .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 16px; color: var(--ink-secondary); }
.fs .tl .sub .met { color: var(--pen); font-weight: 600; }
.fs .tl .d { flex: none; width: 96px; height: 100%; max-height: 96px; border: 0; }
.fs .tl h3 { margin: 0; padding: 4px 0 8px; font-size: 16px; font-weight: 600; color: var(--ink-secondary); }

/* A short screen (a phone on its side): the chips, the hint lines and the way on drop out, so five rows fit. Last, so it wins. */
@container fs (max-height: 540px) {
  .fs .screen { padding-top: 8px; padding-bottom: 6px; }
  .fs .chips { display: none; }
  .fs .corner h2 { font-size: 26px; }
  .fs .corner .wk { display: none; }
  .fs .hd { padding: 4px 0; }
  .fs .pk { padding: 4px 2px; }
  .fs .pk .extra { display: none; }
  .fs .pk.lbl .g { display: none; }
  .fs .cue { display: none; }
}

/* A day that meets the daily pick (K30, K35): its name in pen with a check, a bold pen line at its foot. */
.fs .hd.met .dn { color: var(--pen); }
.fs .hd .dn .check { width: 0.75em; height: 0.75em; margin-left: 3px; vertical-align: -0.02em; }
.fs .d.last { position: relative; }
.fs .d.met.last::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 0; height: 6px; border-radius: 3px 3px 0 0; background: var(--pen); }
</style>
</head>
<body>
<p class="variant label">A 1280×800 desktop, at rest. Move to the top edge for the bar; scroll for Food; press a box to mark it.</p>
<div class="device" data-w="1280" data-h="800" data-input="mouse"></div>
<div class="gap"></div>
<p class="variant label">A 390×844 phone held upright, folded, the bar called up with the handle</p>
<div class="device phone" data-w="390" data-h="844" data-input="touch" data-bar="shown"></div>

//   option  'a' | 'b' | 'c'   how the bar and the titles behave (the mockup's question 1)
//   phone   'p1' | 'p2'       a phone held upright: today, or the week narrow (question 2)
//   input   'mouse' | 'touch' how the bar is reached: the top edge, or the handle
//   start   'exercises' | 'food'   bar  'shown'   for the stills on the mockup page
// The week is John's own from his screenshots: 19–25 October, today Sunday, three a day.
(() => {
  const ART = window.FP_ART
  const DAYS = [['Mon', 'Monday', 19], ['Tue', 'Tuesday', 20], ['Wed', 'Wednesday', 21], ['Thu', 'Thursday', 22],
    ['Fri', 'Friday', 23], ['Sat', 'Saturday', 24], ['Sun', 'Sunday', 25]]
  const TODAY = 6
  const PICK = 3
  const WEEK = '19–25 October'
  const g = 'great', p = 'partial', x = 'missed', _ = null
  const EXERCISES = [
    { name: 'Push-ups', chips: ['3 × 12'], goal: 4, marks: [g, _, g, p, g, _, _] },
    { name: 'Squats', chips: ['3 × 15', '16 kg'], goal: 3, marks: [_, g, x, _, g, _, _] },
    { name: 'Plank', chips: ['3 × 45 s'], goal: 3, marks: [g, p, _, g, _, g, _] },
    { name: 'Kettlebell halos', chips: ['8 each side', '12 kg'], goal: 2, marks: [_, _, g, _, _, _, _] },
    { name: 'Pull-ups', chips: ['3 × 5'], goal: 3, marks: [x, g, _, _, p, _, _] },
  ]
  const FOODS = [
    { name: 'Vegetables', goal: 7, marks: [g, g, g, _, g, g, _] },
    { name: 'Fruit', goal: 5, marks: [_, g, _, g, _, _, _] },
    { name: 'Fish', goal: 2, marks: [_, _, _, g, _, _, _] },
    { name: 'Nuts', goal: 3, marks: [g, _, _, _, _, _, _] },
  ]
  const WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight']
  const KIND_WORDS = { great: '', partial: ', partly done', missed: ", couldn't do it" }
  const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'
  const icon = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')

  // The Stamped ticks set, as John's screenshots draw it: the box filled solid in the pen, the
  // symbol in paper, the hand-drawn box over both.
  function markSvg(kind) {
    const ink = kind
      ? `<path class="ink" d="${ART.stamp}" fill-rule="evenodd"/><path class="sym" d="${ART.ticks[kind]}" fill="none" stroke-width="3.25"/>`
      : ''
    return `<svg viewBox="0 0 36 36" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ink}<path class="bx" d="${ART.box}" stroke-width="1.75"/></svg>`
  }
  function markButton(row, i, section) {
    const kind = row.marks[i]
    const [, full, date] = DAYS[i]
    const label = `${row.name}, ${full} ${date} October${i === TODAY ? ', today' : ''}${kind ? KIND_WORDS[kind] : ''}`
    return `<button type="button" class="mark" data-s="${section}" data-r="${row.i}" data-c="${i}"${kind ? ` data-mark="${kind}"` : ''} aria-pressed="${Boolean(kind)}" aria-label="${esc(label)}">${markSvg(kind)}</button>`
  }

  const count = (row) => row.marks.filter(Boolean).length
  const TITLES = { exercises: 'Exercises', food: 'Food' }
  /** Round 3: a day whose marked exercises reach the daily pick. Only the Exercises screen shows it. */
  const dayMet = (rows, i, section) => section === 'exercises' && rows.filter((r) => r.marks[i]).length >= PICK
  const metHead = (met) => (met ? ' met' : '')
  const METWORDS = '<span class="vh">, three picked</span>'

  // ---- The week grid, wide: a desktop, an iPad, a phone on its side. ----
  function wideScreen(state, section, rows) {
    const corner = state.option === 'b' || state.short
    const head = corner ? '' : `<header class="head"><h2>${TITLES[section]}<span class="wk">${WEEK}</span></h2></header>`
    const cornerCell = corner
      ? `<div class="hd corner"><h2>${TITLES[section]}</h2><span class="wk">${WEEK}</span></div>`
      : `<div class="hd corner"><span class="vh">${section === 'food' ? 'Food' : 'Exercise'}</span></div>`
    let cells = cornerCell
    DAYS.forEach(([short, , date], i) => {
      const met = dayMet(rows, i, section)
      cells += `<div class="hd${i === TODAY ? ' today' : ''}${metHead(met)}"><span class="dn">${short}${met ? CHECK : ''}</span><span class="vh"> ${date}</span>${met ? METWORDS : ''}</div>`
    })
    for (const row of rows) {
      const chips = row.chips?.length ? `<span class="chips">${row.chips.map((c) => `<span class="chip">${esc(c)}</span>`).join('')}</span>` : ''
      cells += `<div class="nm"><span class="n">${esc(row.name)}</span>${chips}</div>`
      const last = row.i === rows.length - 1 ? ' last' : ''
      row.marks.forEach((_, i) => { cells += `<div class="d${i === TODAY ? ' today' : ''}${metHead(dayMet(rows, i, section))}${last}">${markButton(row, i, section)}</div>` })
    }
    const cue = section === 'exercises' && state.option !== 'b' && !state.short
      ? `<button type="button" class="cue" data-go="food">Food${icon('m6 9 6 6 6-6')}</button>` : ''
    return `<section class="screen" data-section="${section}" aria-label="${TITLES[section]}">${head}<div class="grid" style="--rows:${rows.length}">${cells}</div>${cue}</section>`
  }

  // ---- P2: the week, narrow. ----
  function narrowWeek(state, section, rows) {
    let cells = ''
    DAYS.forEach(([short, , date], i) => {
      const met = dayMet(rows, i, section)
      cells += `<div class="hd${i === TODAY ? ' today' : ''}${metHead(met)}"><span class="dn">${short}${met ? CHECK : ''}</span><span class="vh"> ${date}</span>${met ? METWORDS : ''}</div>`
    })
    for (const row of rows) {
      const chips = (row.chips || []).slice(0, 1).map((c) => `<span class="chip">${esc(c)}</span>`).join('')
      cells += `<div class="line"><span class="n">${esc(row.name)}</span>${chips}</div>`
      const last = row.i === rows.length - 1 ? ' last' : ''
      row.marks.forEach((_, i) => { cells += `<div class="d${i === TODAY ? ' today' : ''}${metHead(dayMet(rows, i, section))}${last}">${markButton(row, i, section)}</div>` })
    }
    return `<section class="screen" data-section="${section}" aria-label="${TITLES[section]}"><header class="head"><h2>${TITLES[section]}</h2></header><div class="ngrid" style="--t:${TODAY}">${cells}</div></section>`
  }

  // ---- P1: today, full screen. ----
  function todayScreen(state, section, rows) {
    const done = rows.filter((r) => r.marks[TODAY]).length
    const band = section === 'exercises'
      ? `<div class="band"><h2>Today, Sunday 25 October</h2><p>${done === 0 ? 'None' : WORDS[done][0].toUpperCase() + WORDS[done].slice(1)} of ${WORDS[PICK]} picked.</p></div>`
      : ''
    const list = rows.map((r) => {
      const chips = (r.chips || []).map((c) => `<span class="chip">${esc(c)}</span>`).join('')
      const n = count(r)
      return `<div class="row"><div class="text"><span class="n">${esc(r.name)}</span><span class="sub">${chips}<span class="${n >= r.goal ? 'met' : ''}" data-tot="${section}-${r.i}">${n} of ${r.goal} this week</span></span></div><div class="d">${markButton(r, TODAY, section)}</div></div>`
    }).join('')
    return `<section class="screen" data-section="${section}" aria-label="${TITLES[section]}">${band}<h3>${TITLES[section]}</h3><div class="tl" style="--rows:${rows.length}">${list}</div></section>`
  }

  // ---- The bar (the Header card). ----
  const ICONS = {
    fullscreen: 'M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3',
    print: 'M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z',
    logout: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
  }
  /** The browser's full screen, where it exists (not on an iPhone). */
  const canFullscreen = () => document.fullscreenEnabled !== false
  const fsButton = () => canFullscreen()
    ? `<button class="icon-btn" type="button" data-action="fullscreen" aria-label="Full screen">${icon(ICONS.fullscreen)}</button>` : ''

  // ---- The sidebar (round 4, N2): hidden, or expanded with an icon and a name per item. ----
  function sidebar() {
    const item = (label, d, action) => `<button class="item" type="button"${action ? ` data-action="${action}"` : ''}>${d.startsWith('<svg') ? d : icon(d)}<span>${label}</span></button>`
    const week = `<nav class="week" aria-label="Week"><button class="icon-btn" type="button" aria-label="Previous week">${icon('m15 18-6-6 6-6')}</button><span class="week-label">${WEEK}</span><button class="icon-btn" type="button" aria-label="Next week">${icon('m9 18 6-6-6-6')}</button></nav>`
    const sw = `<button class="switch" type="button" role="switch" aria-checked="false"><span>Edit plan</span><span class="track" aria-hidden="true"><span class="thumb"></span></span></button>`
    return `<aside class="side" aria-label="Menu"><span class="brand">${ART.wordmark}</span>${week}${sw}<div class="items">${item('Settings', ART.gear)}${item('Print…', ICONS.print)}${canFullscreen() ? item('Full screen', ICONS.fullscreen, 'fullscreen') : ''}</div><div class="room" aria-hidden="true"></div><div class="items foot">${item('Log out', ICONS.logout)}</div></aside><div class="scrim" aria-hidden="true"></div>`
  }

  function bar(state) {
    if (state.nav === 'side') return sidebar()
    const week = `<nav class="week" aria-label="Week"><button class="icon-btn" type="button" aria-label="Previous week">${icon('m15 18-6-6 6-6')}</button><span class="week-label">${WEEK}</span><button class="icon-btn" type="button" aria-label="Next week">${icon('m9 18 6-6-6-6')}</button></nav>`
    const sw = (long) => `<button class="switch" type="button" role="switch" aria-checked="false" aria-label="Edit plan"><span aria-hidden="true">${long ? 'Edit plan' : 'Edit'}</span><span class="track" aria-hidden="true"><span class="thumb"></span></span></button>`
    const gear = `<button class="icon-btn" type="button" aria-label="Settings">${ART.gear}</button>`
    if (state.layout === 'narrow') {
      const seg = state.phone === 'p1' && state.device === 'phone'
        ? '<span class="seg" role="group" aria-label="View"><button type="button" aria-pressed="true">Today</button><button type="button" aria-pressed="false">Week</button></span>' : ''
      return `<header class="bar"><span class="start"></span>${week}<span class="end">${fsButton()}${gear}</span><span class="row-2">${seg}${sw(false)}</span></header>`
    }
    return `<header class="bar"><span class="start">${ART.wordmark}</span>${week}<span class="end">${sw(true)}${fsButton()}${gear}<button class="btn" type="button">Print…</button></span></header>`
  }

  function render(state) {
    const ex = state.ex, food = state.food
    const screen = state.layout === 'narrow' ? (state.phone === 'p1' && state.device === 'phone' ? todayScreen : narrowWeek) : wideScreen
    const dots = `<nav class="dots" aria-label="Screens"><button type="button" data-go="exercises" aria-label="Exercises"><span></span></button><button type="button" data-go="food" aria-label="Food"><span></span></button></nav>`
    state.el.innerHTML = `<div class="hot" aria-hidden="true"></div><button type="button" class="grab" aria-label="Show the menu"><span></span></button>${bar(state)}<div class="scroller">${screen(state, 'exercises', ex)}${screen(state, 'food', food)}</div>${dots}`
    syncDots(state)
  }

  function syncDots(state) {
    const sc = state.el.querySelector('.scroller')
    if (!sc) return
    const at = sc.scrollTop > sc.clientHeight / 2 ? 'food' : 'exercises'
    state.el.querySelectorAll('.dots button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.go === at)))
  }

  function mount(el, opts = {}) {
    const clone = (rows) => rows.map((r, i) => ({ ...r, i, marks: [...r.marks] }))
    const state = { el, option: opts.option || 'a', phone: opts.phone || 'p2', affirm: opts.affirm || 'g2', nav: opts.nav || 'bar', ex: clone(EXERCISES), food: clone(FOODS), layout: '', short: false }
    el.classList.add('fs')
    el.dataset.option = state.option
    el.dataset.affirm = state.affirm
    el.dataset.nav = state.nav
    el.dataset.input = opts.input || (matchMedia('(hover: none)').matches ? 'touch' : 'mouse')
    let pinned = opts.bar === 'shown'
    if (pinned) el.dataset.bar = 'shown'

    const measure = () => {
      const w = el.offsetWidth, h = el.offsetHeight
      // Held upright, a phone or an iPad folds the week; a phone may show today instead (P1).
      const layout = h > w && w < 1000 ? 'narrow' : 'wide'
      el.dataset.device = w < 640 || h < 640 ? 'phone' : 'tablet'
      state.device = el.dataset.device
      const short = layout === 'wide' && h <= 540
      if (layout === state.layout && short === state.short) return
      const sc = el.querySelector('.scroller')
      const onFood = sc && sc.scrollTop > sc.clientHeight / 2
      state.layout = layout; state.short = short
      el.dataset.layout = layout
      render(state)
      if (onFood) go('food', false)
    }
    const go = (section, smooth = true) => {
      const target = el.querySelector(`.screen[data-section="${section}"]`)
      el.querySelector('.scroller').scrollTo({ top: target.offsetTop, behavior: smooth && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 'smooth' : 'auto' })
    }

    // The bar: shown while the pointer is at the top edge or on the bar, or while focus is in it;
    // on touch, by the handle, and hidden again by a press anywhere else.
    let hideTimer
    const show = () => { clearTimeout(hideTimer); el.dataset.bar = 'shown' }
    const hideSoon = (ms = 500) => {
      if (state.option === 'c' || pinned) return
      clearTimeout(hideTimer)
      hideTimer = setTimeout(() => { if (!el.querySelector('.bar, .side')?.matches(':focus-within')) delete el.dataset.bar }, ms)
    }
    el.addEventListener('pointerover', (e) => {
      if (e.pointerType === 'touch') return
      if (e.target.closest('.hot, .bar, .side')) show()
    })
    el.addEventListener('pointerout', (e) => {
      if (e.pointerType === 'touch') return
      if (e.target.closest('.hot, .bar, .side') && !e.relatedTarget?.closest?.('.hot, .bar, .side')) { pinned = false; hideSoon() }
    })
    el.addEventListener('pointerleave', () => { if (pinned) { pinned = false; hideSoon(900) } })
    el.addEventListener('focusout', () => hideSoon(200))
    el.addEventListener('keydown', (e) => { if (e.key === 'Escape') { pinned = false; delete el.dataset.bar } })
    let pull
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.grab')) { pull = e.clientY; return }
      if ((el.dataset.input === 'touch' || e.target.closest('.scrim')) && !e.target.closest('.bar, .side')) { pinned = false; hideSoon(0) }
    })
    el.addEventListener('pointermove', (e) => { if (pull != null && e.clientY - pull > 12) { show(); pull = null } })
    el.addEventListener('pointerup', () => { pull = null })

    el.addEventListener('click', (e) => {
      if (e.target.closest('.grab')) { if (el.dataset.bar === 'shown') delete el.dataset.bar; else show(); return }
      if (e.target.closest('[data-action="fullscreen"]')) {
        if (document.fullscreenElement) document.exitFullscreen?.()
        else el.requestFullscreen?.().catch(() => {})
        return
      }
      const goto = e.target.closest('[data-go]')
      if (goto) { go(goto.dataset.go); return }
      const btn = e.target.closest('.mark')
      if (!btn) return
      const rows = btn.dataset.s === 'food' ? state.food : state.ex
      const row = rows[Number(btn.dataset.r)]
      const c = Number(btn.dataset.c)
      // A press steps an exercise great, partial, missed, then empty; a food great, then empty.
      const cycle = btn.dataset.s === 'food' ? [null, g] : [null, g, p, x]
      row.marks[c] = cycle[(cycle.indexOf(row.marks[c]) + 1) % cycle.length]
      const sc = el.querySelector('.scroller'), top = sc.scrollTop
      render(state)
      el.querySelector('.scroller').scrollTop = top
      el.querySelector(`.mark[data-s="${btn.dataset.s}"][data-r="${btn.dataset.r}"][data-c="${c}"]`)?.focus({ preventScroll: true })
    })
    el.addEventListener('scroll', () => syncDots(state), true)

    new ResizeObserver(measure).observe(el)
    measure()
    if (opts.start === 'food') requestAnimationFrame(() => go('food', false))
    return state
  }

  window.FP = { mount }
})()
  for (const device of document.querySelectorAll('.device')) {
    const w = Number(device.dataset.w), h = Number(device.dataset.h)
    const screen = document.createElement('div')
    screen.style.width = w + 'px'
    screen.style.height = h + 'px'
    device.append(screen)
    const fit = () => {
      const s = Math.min(1, device.clientWidth / w)
      screen.style.transform = `scale(${s})`
      device.style.height = Math.ceil(h * s) + 'px'
    }
    new ResizeObserver(fit).observe(device)
    fit()
    FP.mount(screen, { option: 'a', phone: 'p2', affirm: 'g2', input: device.dataset.input, bar: device.dataset.bar })
  }
</script>
</body>
</html>
