<!-- @dsCard group="Feedback" height=300 subtitle="Error, caution, success and info: each an icon and words" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InlineMessage — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .stack { display: flex; flex-direction: column; gap: var(--space-4); max-width: 520px; }
  .cell { display: flex; flex-direction: column; gap: var(--space-1); }
  .state { margin: 0; color: var(--ink-secondary); }

  .msg { display: flex; gap: var(--space-2); align-items: flex-start; margin: 0; }
  .msg svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
  .msg.error { color: var(--error-ink); }
  .msg.caution { color: var(--caution-ink); }
  .msg.success { color: var(--ink); }
  .msg.info { color: var(--ink-secondary); }
</style>
</head>
<body>
<div class="stack">
  <div class="cell"><p class="caption state">Error</p>
    <p class="caption msg error" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>Can’t reach the server. Check the connection and try again.</span></p></div>
  <div class="cell"><p class="caption state">Caution: over the daily pick</p>
    <p class="caption msg caution" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg><span>Four exercises today, one extra.</span></p></div>
  <div class="cell"><p class="caption state">Success</p>
    <p class="caption msg success" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Added to your account. This browser’s earlier log is now part of it, on every device.</span></p></div>
  <div class="cell"><p class="caption state">Info</p>
    <p class="caption msg info" role="status"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>Nothing new: everything in that file is already here.</span></p></div>
</div>
<script></script>
</body>
</html>
