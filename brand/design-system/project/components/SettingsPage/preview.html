<!-- @dsCard group="Screens" height=1360 subtitle="Settings as a page of its own, in rows like the week: appearance (marks, theme), your data, account" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SettingsPage — preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }

  /* The page, at u = 1 (a 1280×800 screen): full width on 48px margins, in rows like the week (K51). In the app every size follows the screen. */
  .stage { border: 1px solid var(--line); border-radius: var(--radius-lg); }
  .bar { display: flex; align-items: center; padding: 14px 48px; border-bottom: 1px solid var(--line); }
  .wordmark { font-family: var(--font-serif); font-weight: 600; font-size: 40px; line-height: 44px; }
  .page { padding: 28px 48px 64px; display: flex; flex-direction: column; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 19px; line-height: 26px; text-decoration: underline; text-underline-offset: 4px; }
  .back svg { width: 26px; height: 26px; }
  .back:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-sm); }
  h1 { margin: 12px 0 28px; font-size: 40px; line-height: 46px; }
  /* A section is a row: its heading in the week's 320px name column, its settings to the right. */
  section { display: grid; grid-template-columns: 320px minmax(0, 1fr); align-items: start; padding: 32px 0; border-top: 1px solid var(--line); }
  h2 { margin: 0; font-size: 27px; line-height: 34px; }
  .body-col { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
  .field { display: flex; flex-direction: column; gap: 12px; }
  .group { display: flex; flex-direction: column; gap: 12px; }
  .field > .label, .group > .label { font-size: 19px; line-height: 25px; }
  .lede { margin: 0; max-width: 60ch; color: var(--ink-secondary); font-size: 19px; line-height: 28px; }
  .who { margin: 0; color: var(--ink-secondary); font-size: 19px; line-height: 28px; }
  .who span { color: var(--ink); font-weight: 600; }

  /* SegmentedControl, drawn as its own card at the page's size: 60px tall, segments at 19px. */
  .seg { display: inline-flex; flex-wrap: wrap; align-self: flex-start; box-sizing: border-box; max-width: 100%; border: 1px solid var(--control-border); border-radius: var(--radius-md); }
  .seg button { position: relative; height: 58px; padding: 0 22px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); font: 600 19px/25px var(--font-sans); cursor: pointer; text-wrap: nowrap; }
  .seg button:hover, .seg button.is-hover { background: var(--tile); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .seg button:focus-visible, .seg button.is-focus { z-index: 1; outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .seg button { transition: background-color 120ms ease-out, color 120ms ease-out; }
  }

  /* Stepper, drawn as its own card at the page's size: minus, value, plus in one 60px control. */

  /* RadioCard at the page's size: the options are tiles, three to a row, the dot and name over the picture. */
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .choice { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; padding: 12px 16px;
            border: 1px solid var(--control-border); border-radius: var(--radius-md); background: transparent; color: var(--ink);
            font: inherit; text-align: left; cursor: pointer; }
  .choice:hover, .choice.is-hover { background: var(--tile); }
  .choice[aria-checked="true"] { border: 2px solid var(--ink); padding: 11px 15px; }
  .choice[aria-checked="true"] .name { font-weight: 600; }
  .choice:focus-visible, .choice.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .choice .name { flex: 1; min-width: 0; font-size: 19px; line-height: 25px; }
  .choice .picture { display: flex; gap: 10px; width: 100%; padding-left: 37px; }
  .dot { flex: none; width: 23px; height: 23px; border: 1px solid var(--control-border); border-radius: var(--radius-full); display: grid; place-items: center; }
  .choice[aria-checked="true"] .dot { border: 2px solid var(--ink); }
  .choice[aria-checked="true"] .dot::after { content: ""; width: 12px; height: 12px; border-radius: var(--radius-full); background: var(--ink); }
  @media (prefers-reduced-motion: no-preference) { .choice { transition: background-color 120ms ease-out; } }

  /* Mark sets (K20): the app's DayMark paths as inline SVG. A squiggle fills its drawing; a tick or
     face set strokes its symbol in the pen at 4.5 units; a stamped set fills the box solid in the
     pen with the symbol in paper at 3.25 units. The box is drawn last, over the ink. */
  .smark { width: 60px; height: 60px; display: grid; place-items: center; flex: none; }
  .smark svg { width: 94%; height: 94%; overflow: visible; }
  .smark .box { stroke: var(--control-border); }
  .smark[data-mark="great"] { color: var(--pen); }
  .smark[data-mark="partial"] { color: var(--pen-partial); }
  .smark[data-mark="missed"] { color: var(--pen-missed); }
  .smark .paper { color: var(--canvas); }

  .btns { display: flex; gap: var(--space-2); }
  .btn { height: 60px; padding: 0 22px; font-size: 19px; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border-radius: var(--radius-md); font: inherit; font-weight: 600; cursor: pointer; background: transparent; color: var(--ink); border: 1px solid var(--control-border); }
  .btns .btn { flex: 1; }
  .btn:hover { background: var(--tile); }
  .btn svg { width: 26px; height: 26px; }


  /* Switch, drawn as its own card. */
  .switch { display: inline-flex; align-items: center; gap: var(--space-3); height: 44px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); font: 400 16px/24px var(--font-sans); cursor: pointer; text-wrap: nowrap; }
  .switch:hover, .switch.is-hover { background: var(--tile); }
  .switch:focus-visible, .switch.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .switch:disabled { opacity: .4; cursor: not-allowed; background: transparent; }
  .track { position: relative; box-sizing: border-box; flex: none; width: 40px; height: 24px; border: 1px solid var(--control-border); border-radius: var(--radius-full); background: transparent; }
  .thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: var(--radius-full); background: var(--ink-secondary); }
  .switch[aria-checked="true"] .track { background: var(--ink); border-color: var(--ink); }
  .switch[aria-checked="true"] .thumb { left: 19px; background: var(--on-ink); }

  .btns .btn { flex: none; }
  /* A control beside its words (K53), wrapping under them when the row is too narrow. */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; }
  .row .lede { max-width: 34ch; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) { button { transition: background-color 120ms, color 120ms; } }
  /* Folded: one column, the heading over its settings, at the system's sizes. */
  @media (max-width: 639px) {
    body { padding: var(--space-4); }
    .bar { padding: 10px 16px; }
    .wordmark { font-size: 32px; line-height: 36px; }
    .page { padding: 20px 16px 48px; }
    h1 { font-size: 30px; line-height: 36px; margin-bottom: 16px; }
    section { display: flex; flex-direction: column; gap: 16px; padding: 24px 0; }
    h2 { font-size: 22px; line-height: 28px; }
    .body-col { gap: 20px; }
    .field > .label, .group > .label { font-size: 16px; line-height: 22px; }
    .lede, .who, .back, .choice .name { font-size: 18px; line-height: 26px; }
    .seg button { height: 46px; padding: 0 16px; font-size: 16px; }
      .btn { height: 48px; padding: 0 16px; font-size: 16px; }
    .choices { grid-template-columns: minmax(0, 1fr); }
    .choice { flex-wrap: nowrap; padding: 10px 14px; }
    .choice[aria-checked="true"] { padding: 9px 13px; }
    .choice .picture { width: auto; gap: 6px; padding-left: 0; }
    .smark { width: 44px; height: 44px; }
  }
</style>
</head>

<script>
(() => {
  document.addEventListener('click', (e) => {
    const seg = e.target.closest('.seg button');
    if (seg) seg.parentElement.querySelectorAll('button').forEach((b) => { b.setAttribute('aria-pressed', String(b === seg)); b.tabIndex = b === seg ? 0 : -1; });
  });
  // SegmentedControl: one tab stop; arrow keys move between segments (Reka's roving focus).
  document.querySelectorAll('.seg').forEach((g) => g.addEventListener('keydown', (e) => {
    const all = [...g.querySelectorAll('button:not([disabled])')];
    const i = all.indexOf(e.target);
    const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (i < 0 || !d) return;
    e.preventDefault();
    const next = all[(i + d + all.length) % all.length];
    all.forEach((b) => (b.tabIndex = b === next ? 0 : -1));
    next.focus();
  }));
})();
</script>
<script>
(() => {
  // RadioCard: pressing a row chooses it; arrow keys move to the next or previous row and choose it.
  const choose = (row) => {
    const rows = [...row.parentElement.querySelectorAll('[role="radio"]')]
    rows.forEach((r) => { r.setAttribute('aria-checked', String(r === row)); r.tabIndex = r === row ? 0 : -1 })
  }
  document.addEventListener('click', (e) => { const row = e.target.closest('[role="radio"]'); if (row) choose(row) })
  document.addEventListener('keydown', (e) => {
    const row = e.target.closest('[role="radio"]')
    const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key]
    if (!row || !d) return
    e.preventDefault()
    const rows = [...row.parentElement.querySelectorAll('[role="radio"]')]
    const next = rows[(rows.indexOf(row) + d + rows.length) % rows.length]
    choose(next)
    next.focus()
  })
})()
</script>
