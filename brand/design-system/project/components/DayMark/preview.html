<!-- @dsCard group="Planner" height=560 subtitle="Done, not done, today, note and focus, in all four inks" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DayMark — preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: var(--space-6); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  h2 { margin: 0 0 var(--space-3); color: var(--ink-secondary); }
  section + section { margin-top: var(--space-8); }

  /* The cell: one day of one row, at least 44px tall. In the grid it is a <td>. */
  .cell { position: relative; width: 56px; height: 60px; display: grid; place-items: center; }
  .cell.today { background: var(--highlight); }

  /* The mark: a 44px button whose ::before is the 24px dot or ring. */
  .mark { width: 44px; height: 44px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; display: grid; place-items: center; cursor: pointer; color: inherit; }
  .mark::before { content: ""; width: 24px; height: 24px; border-radius: var(--radius-full); border: 1.5px solid var(--control-border); }
  .mark[aria-pressed="true"]::before { background: var(--pen); border-color: var(--pen); }
  .mark[aria-pressed="false"]:hover::before { border-color: var(--ink); }
  .mark:focus-visible, .mark.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .mark::before { transition: background-color 120ms, border-color 120ms; }
  }

  /* NoteMark: a folded corner, 10px, in the cell's top-right corner. */
  .note-mark { position: absolute; top: 0; right: 0; width: 10px; height: 10px; background: var(--ink-secondary); clip-path: polygon(0 0, 100% 0, 100% 100%); pointer-events: none; }

  /* States: specimens with their captions. */
  .states { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-2); margin: 0; padding: 0; list-style: none; }
  .states li { width: 100px; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); text-align: center; }
  .states .caption { color: var(--ink-secondary); }

  /* Inks: one row per ink, each overriding --pen locally. */
  .inks { border-collapse: collapse; }
  .inks th { text-align: left; font-weight: inherit; padding: 0 var(--space-3) 0 0; }
  .inks thead th { color: var(--ink-secondary); text-align: center; padding: 0 0 var(--space-1); width: 56px; }
  .inks thead th:first-child { text-align: left; }
  .inks tbody th { white-space: nowrap; }
  .inks tbody tr { border-top: 1px solid var(--line); }
  .inks td { padding: 0; }
  .ink-blue { --pen: var(--ink-blue); }
  .forest { --pen: var(--forest); }
  .violet { --pen: var(--violet); }
  .graphite { --pen: var(--graphite); }
  .default { color: var(--ink-secondary); font-weight: 400; }

  @media (max-width: 639px) {
    body { padding: var(--space-4); }
    .inks thead th { width: 52px; }
    .inks .cell { width: 52px; }
  }
</style>
</head>
<body>
<section aria-labelledby="states-h">
  <h2 id="states-h" class="label">States, in the default ink</h2>
  <ul class="states">
    <li>
      <div class="cell"><button type="button" class="mark" aria-pressed="false" aria-label="Push-ups, Tuesday 20 October"></button></div>
      <span class="caption">Not done</span>
    </li>
    <li>
      <div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Push-ups, Monday 19 October"></button></div>
      <span class="caption">Done</span>
    </li>
    <li>
      <div class="cell today"><button type="button" class="mark" aria-pressed="false" aria-current="date" aria-label="Squats, Thursday 22 October, today"></button></div>
      <span class="caption">Today</span>
    </li>
    <li>
      <div class="cell today"><button type="button" class="mark" aria-pressed="true" aria-current="date" aria-label="Push-ups, Thursday 22 October, today"></button></div>
      <span class="caption">Today, done</span>
    </li>
    <li>
      <div class="cell today"><button type="button" class="mark" aria-pressed="true" aria-current="date" aria-label="Squats, Thursday 22 October, today, has a note"></button><span class="note-mark" aria-hidden="true"></span></div>
      <span class="caption">Has a note</span>
    </li>
    <li>
      <div class="cell today"><button type="button" class="mark is-focus" aria-pressed="true" aria-current="date" aria-label="Pull-ups, Thursday 22 October, today"></button></div>
      <span class="caption">Keyboard focus</span>
    </li>
  </ul>
</section>

<section aria-labelledby="inks-h">
  <h2 id="inks-h" class="label">The four inks</h2>
  <table class="inks">
    <thead>
      <tr>
        <th class="caption" scope="col">Ink</th>
        <th class="caption" scope="col">Not done</th>
        <th class="caption" scope="col">Done</th>
        <th class="caption" scope="col">Today</th>
        <th class="caption" scope="col">Note</th>
      </tr>
    </thead>
    <tbody>
      <tr class="ink-blue">
        <th scope="row" class="label">Ink blue <span class="default">(default)</span></th>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="false" aria-label="Push-ups, Tuesday 20 October"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Push-ups, Wednesday 21 October"></button></div></td>
        <td><div class="cell today"><button type="button" class="mark" aria-pressed="true" aria-current="date" aria-label="Push-ups, Thursday 22 October, today"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Push-ups, Monday 19 October, has a note"></button><span class="note-mark" aria-hidden="true"></span></div></td>
      </tr>
      <tr class="forest">
        <th scope="row" class="label">Forest</th>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="false" aria-label="Pull-ups, Tuesday 20 October"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Pull-ups, Wednesday 21 October"></button></div></td>
        <td><div class="cell today"><button type="button" class="mark" aria-pressed="true" aria-current="date" aria-label="Pull-ups, Thursday 22 October, today"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Pull-ups, Monday 19 October, has a note"></button><span class="note-mark" aria-hidden="true"></span></div></td>
      </tr>
      <tr class="violet">
        <th scope="row" class="label">Violet</th>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="false" aria-label="Squats, Tuesday 20 October"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Squats, Wednesday 21 October"></button></div></td>
        <td><div class="cell today"><button type="button" class="mark" aria-pressed="true" aria-current="date" aria-label="Squats, Thursday 22 October, today"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Squats, Monday 19 October, has a note"></button><span class="note-mark" aria-hidden="true"></span></div></td>
      </tr>
      <tr class="graphite">
        <th scope="row" class="label">Graphite</th>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="false" aria-label="Kettlebell halos, Tuesday 20 October"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Kettlebell halos, Wednesday 21 October"></button></div></td>
        <td><div class="cell today"><button type="button" class="mark" aria-pressed="true" aria-current="date" aria-label="Kettlebell halos, Thursday 22 October, today"></button></div></td>
        <td><div class="cell"><button type="button" class="mark" aria-pressed="true" aria-label="Kettlebell halos, Monday 19 October, has a note"></button><span class="note-mark" aria-hidden="true"></span></div></td>
      </tr>
    </tbody>
  </table>
</section>
<script>
  // A mark toggles on click, Enter or Space; aria-pressed carries the state.
  document.addEventListener('click', (e) => {
    const mark = e.target.closest('.mark');
    if (!mark) return;
    mark.classList.remove('is-focus');
    mark.setAttribute('aria-pressed', String(mark.getAttribute('aria-pressed') !== 'true'));
  });
</script>
</body>
</html>
