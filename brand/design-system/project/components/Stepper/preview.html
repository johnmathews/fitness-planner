<!-- @dsCard group="Forms" height=250 subtitle="Minus, value, plus: 44px buttons and a tabular figure" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stepper — preview</title>
<style>
  body { margin: 0; padding: var(--space-6) var(--space-4); background: var(--canvas); color: var(--ink); font-family: var(--font-sans); }
  .grid { display: flex; flex-wrap: wrap; gap: var(--space-6) var(--space-8); align-items: flex-start; }
  .cell { min-width: 0; }
  .state { margin: 0 0 var(--space-2); color: var(--ink-secondary); }
  .field { display: flex; flex-direction: column; gap: var(--space-1); align-items: flex-start; }

  .stepper { display: inline-flex; align-items: stretch; box-sizing: border-box; height: 44px; border: 1px solid var(--control-border); border-radius: var(--radius-md); }
  .stepper button { display: inline-flex; align-items: center; justify-content: center; width: 44px; padding: 0; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink); cursor: pointer; }
  .stepper button svg { width: 20px; height: 20px; }
  .stepper button:hover, .stepper button.is-hover { background: var(--tile); }
  .stepper button:focus-visible, .stepper button.is-focus { outline: 2px solid var(--focus); outline-offset: 2px; }
  .stepper button[aria-disabled="true"] { cursor: default; background: transparent; }
  .stepper button[aria-disabled="true"] svg { opacity: .4; }
  .value { display: flex; align-items: center; justify-content: center; min-width: 48px; padding: 0 var(--space-1); font: 600 17px/24px var(--font-sans); font-variant-numeric: tabular-nums; }
  .stepper.is-disabled { opacity: .4; }
  .stepper.is-disabled button { cursor: not-allowed; }
  @media (prefers-reduced-motion: no-preference) {
    .stepper button { transition: background-color 120ms ease-out; }
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><p class="caption state">Default</p>
    <div class="field"><span class="label" id="s1">Exercises per day</span>
      <div class="stepper" role="group" aria-labelledby="s1">
        <button type="button" aria-label="Fewer exercises per day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <output class="value" aria-live="polite">3</output>
        <button type="button" aria-label="More exercises per day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></div></div>
  <div class="cell"><p class="caption state">Hover on plus</p>
    <div class="field"><span class="label" id="s2">Exercises per day</span>
      <div class="stepper" role="group" aria-labelledby="s2">
        <button type="button" aria-label="Fewer exercises per day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <output class="value" aria-live="polite">3</output>
        <button type="button" class="is-hover" aria-label="More exercises per day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></div></div>
  <div class="cell"><p class="caption state">Focus on plus</p>
    <div class="field"><span class="label" id="s3">Reps</span>
      <div class="stepper" role="group" aria-labelledby="s3">
        <button type="button" aria-label="Fewer reps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <output class="value" aria-live="polite">12</output>
        <button type="button" class="is-focus" aria-label="More reps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></div></div>
  <div class="cell"><p class="caption state">At the minimum</p>
    <div class="field"><span class="label" id="s4">Exercises per day</span>
      <div class="stepper" role="group" aria-labelledby="s4">
        <button type="button" aria-label="Fewer exercises per day" aria-disabled="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <output class="value" aria-live="polite">1</output>
        <button type="button" aria-label="More exercises per day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></div></div>
  <div class="cell"><p class="caption state">Disabled</p>
    <div class="field"><span class="label" id="s5">Exercises per day</span>
      <div class="stepper is-disabled" role="group" aria-labelledby="s5">
        <button type="button" aria-label="Fewer exercises per day" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <output class="value">3</output>
        <button type="button" aria-label="More exercises per day" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div></div></div>
</div>
<script></script>
</body>
</html>
